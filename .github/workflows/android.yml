name: Android patcher
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/build-payloads.py
      - run: curl --fail --location https://github.com/ByHanyou/Plural-Star/releases/download/v1.23.3/app-release.apk --output "$RUNNER_TEMP/plural-star.apk"
      - run: PLURAL_STAR_APK="$RUNNER_TEMP/plural-star.apk" bash gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sparklecat-plural-star-mods-debug
          path: app/build/outputs/apk/debug/app-debug.apk
