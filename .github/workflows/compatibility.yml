name: Latest Plural Star compatibility
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: latest-compatibility
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PLURAL_STAR_BASE: ${{ github.workspace }}/.work/latest-base.json
      PLURAL_STAR_APK: ${{ github.workspace }}/.work/latest-official.apk
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest official release
        id: latest
        run: python3 scripts/compatibility-release.py resolve
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.needed == 'true'
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        if: steps.latest.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        if: steps.latest.outputs.needed == 'true'
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Discord SDK for the first build
        if: steps.latest.outputs.needed == 'true'
        env:
          DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
        run: |
          if [ -n "$DISCORD_SOCIAL_SDK_URL" ] && curl --fail --location --silent "$DISCORD_SOCIAL_SDK_URL" -o "$RUNNER_TEMP/discord-sdk.zip"; then
            echo "d784097504685953849cc2842561d8a8013326fe0b8df65a1de63ddefde62045  $RUNNER_TEMP/discord-sdk.zip" | sha256sum -c -
            mkdir -p .work/discord-sdk
            unzip -q "$RUNNER_TEMP/discord-sdk.zip" -d .work/discord-sdk
          fi
      - uses: gradle/actions/setup-gradle@v4
        if: steps.latest.outputs.needed == 'true'
      - name: Build and check current mods against latest upstream
        if: steps.latest.outputs.needed == 'true'
        run: python3 scripts/build-payloads.py
      - name: Stage compatibility pack
        if: steps.latest.outputs.needed == 'true'
        run: python3 scripts/compatibility-release.py stage
      - name: Verify packs and real APK signing
        if: steps.latest.outputs.needed == 'true'
        run: bash gradlew :native-tools:test testDebugUnitTest lintDebug lintRelease assembleDebug
      - name: Publish verified compatibility pack
        if: steps.latest.outputs.needed == 'true'
        run: python3 scripts/compatibility-release.py publish
