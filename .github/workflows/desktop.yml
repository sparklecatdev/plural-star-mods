name: Desktop companion builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-companion/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop-companion/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: macos-15-intel
            platform: macos-intel
          - runner: macos-15
            platform: macos-apple-silicon
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop-companion/requirements.txt pyinstaller==6.17.0
      - run: python -m unittest discover -s desktop-companion -p "test_*.py"
      - run: python -m PyInstaller --noconfirm --clean --windowed --hidden-import PIL._tkinter_finder --collect-all keyring --collect-all pystray --name Sparklecat-Discord-Companion desktop-companion/companion.py
      - name: Install virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool dbus-x11 desktop-file-utils
      - name: Test and archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dist/Sparklecat-Discord-Companion.app/Contents/MacOS/Sparklecat-Discord-Companion --self-test
          cp desktop-companion/Install-macOS.command dist/
          chmod +x dist/Install-macOS.command
          (cd dist && zip -qry "../sparklecat-discord-companion-${{ matrix.platform }}.zip" Sparklecat-Discord-Companion.app Install-macOS.command)
      - name: Test and archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dist/Sparklecat-Discord-Companion/Sparklecat-Discord-Companion --self-test
          XDG_CONFIG_HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" timeout 20s xvfb-run -a dist/Sparklecat-Discord-Companion/Sparklecat-Discord-Companion --gui-self-test
          cp desktop-companion/Install-Linux.sh dist/Sparklecat-Discord-Companion/
          chmod +x dist/Sparklecat-Discord-Companion/Install-Linux.sh
          export XDG_DATA_HOME="$(mktemp -d)/data with spaces"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          dist/Sparklecat-Discord-Companion/Install-Linux.sh
          dist/Sparklecat-Discord-Companion/Install-Linux.sh
          desktop-file-validate "$XDG_DATA_HOME/applications/sparklecat-discord-companion.desktop"
          dbus-run-session -- xvfb-run -a bash -c '
            gio launch "$XDG_DATA_HOME/applications/sparklecat-discord-companion.desktop"
            for attempt in {1..50}; do
              if xdotool search --onlyvisible --name "^Sparklecat Discord Companion$" >/dev/null; then exit 0; fi
              sleep 0.2
            done
            echo "Desktop launcher did not open a window" >&2
            exit 1
          '
          tar -czf "sparklecat-discord-companion-${{ matrix.platform }}.tar.gz" -C dist Sparklecat-Discord-Companion
      - name: Test and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Sparklecat-Discord-Companion/Sparklecat-Discord-Companion.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Copy-Item desktop-companion/Install-Windows.ps1 dist/
          Compress-Archive -Path dist/Sparklecat-Discord-Companion,dist/Install-Windows.ps1 -DestinationPath sparklecat-discord-companion-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: sparklecat-discord-companion-${{ matrix.platform }}.*
          if-no-files-found: error
