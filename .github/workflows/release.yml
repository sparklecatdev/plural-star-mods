name: Publish checked APK
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful Android patcher run on main to publish'
        required: true
        type: string
      release_tag:
        description: 'Draft release tag matching the checked app version'
        required: true
        type: string
        default: v0.2.0
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Wait for checks and validate source
        id: build
        shell: bash
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh run watch "$BUILD_RUN_ID" --exit-status --interval 30
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build.json"
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'build.json').read_text())
          release = json.loads((root / 'release.json').read_text())
          assert run['conclusion'] == 'success', 'Build must pass'
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/android.yml'
          assert run['head_branch'] == 'main' and run['event'] in ('push', 'workflow_dispatch')
          assert release['isDraft'], 'Refusing to replace an already published release'
          assert release['targetCommitish'] == run['head_sha'], 'Draft must target the checked commit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('commit=' + run['head_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download APK and package matching source
        shell: bash
        run: |
          mkdir dist
          gh run download "$BUILD_RUN_ID" --name sparklecat-plural-star-mods-debug --dir dist
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r"versionName '([^']+)'", pathlib.Path('app/build.gradle').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag must match the checked app version'
          PY
          version="${RELEASE_TAG#v}"
          mv dist/app-debug.apk "dist/sparklecat-plural-star-mods-$version-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/sparklecat-plural-star-mods-$version-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "dist/sparklecat-plural-star-mods-$version-debug.apk"
          git archive --format=zip --output="dist/plural-star-mods-$version-source.zip" HEAD
      - name: Upload assets and publish development preview
        working-directory: dist
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          sha256sum "sparklecat-plural-star-mods-$version-debug.apk" "plural-star-mods-$version-source.zip" > SHA256SUMS
          gh release upload "$RELEASE_TAG" "sparklecat-plural-star-mods-$version-debug.apk" "plural-star-mods-$version-source.zip" SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
