plugins { id 'com.android.application' }
android {
    namespace 'dev.sparklecat.pluralmods'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'dev.sparklecat.pluralmods'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.android.tools.build:apksig:8.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
tasks.register('verifyPayloads') {
    doLast {
        ['wallpaper', 'storage', 'wallpaper-storage'].each {
            if (!file("src/main/assets/payloads/${it}.bundle").exists())
                throw new GradleException('Missing mod payloads. Run python3 scripts/build-payloads.py first.')
            if (!file("src/main/assets/payloads/${it}.dex").exists())
                throw new GradleException('Missing patch update loader. Run python3 scripts/build-payloads.py first.')
        }
    }
}
tasks.register('packageSource', Zip) {
    from(rootProject.projectDir) {
        include '.github/**', '.gitattributes', '.gitignore', 'LICENSE', 'LICENSES/**', 'THIRD_PARTY_NOTICES.md', 'README.md', 'AGENTS.md', 'release-signing.sha256'
        include 'app/build.gradle', 'app/src/**', 'native-tools/build.gradle', 'native-tools/src/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat', 'gradle/**', 'payload/**', 'scripts/**', 'tests/**'
        exclude 'app/src/main/assets/**', '**/__pycache__/**', '**/node_modules/**'
    }
    destinationDirectory = file('src/main/assets/source')
    archiveFileName = 'plural-star-mods-source.zip'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('preBuild').configure { dependsOn 'verifyPayloads', 'packageSource' }
tasks.withType(Test).configureEach {
    inputs.files(fileTree('src/main/assets/payloads') { include '*.bundle', '*.dex' })
    inputs.property('officialApkConfigured', System.getenv('PLURAL_STAR_APK') != null)
    if (System.getenv('PLURAL_STAR_APK')) inputs.file(System.getenv('PLURAL_STAR_APK'))
}
